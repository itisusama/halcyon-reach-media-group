          <h1>Hira Malik</h1>
          <p class="detail-subtitle">Character File · Writer's Cut</p>
          <div class="meta-strip">
            <span><strong>Age</strong> 26</span>
            <span><strong>On paper</strong> The unflappable front-desk anchor, married last year, keeps a jar of imported toffees for tired staff.</span>
            <span><strong>Underneath</strong> The building's quietest surveillance system, keeping a ledger of what nobody thinks she is counting.</span>
          </div>

      <div class="detail-body">

        <section>
          <h2>Body</h2>
          <p>Hira is five foot four, medium-brown skin that goes gold in the shoulder-season light and grey under the reception halogens. Her hair is shoulder-length, straight, worn loose or in a low twist when the AC is out. She has her mother's mouth — thin upper lip, fuller lower, a slight downturn at rest that strangers read as disapproval and her sister reads as concentration.</p>
          <p>She has one scar on the inside of her left wrist, about two centimetres long, from when she was seven and her cousin dared her to climb the neem tree in their grandmother's courtyard in Sheikhupura. She fell, caught her wrist on a nail sticking out of the neighbour's wall, cried once, then stopped. Her grandmother poured Dettol on it and told her only stupid girls climb trees for boys, which she has thought about many times since.</p>
          <p>Her voice tell is a quarter-second pause before names. She will say, <em>"Please have a seat, sir, and I will let — Shahbaz sahib's office know you are here."</em> She started doing it as a nineteen-year-old junior receptionist so she would not slip and use the wrong honorific. Now it happens even when she is talking about her husband to his mother. Nobody has ever pointed it out. She hopes nobody ever does.</p>
          <p>The stubbornness that is still in her is small and specific. She refuses to raise her voice. Even on the phone with a courier who has lost a client's video hard drive, even with a walk-in journalist demanding to see Faraz sahib without an appointment, even the day her mother-in-law asked in front of the whole extended family why she had not fallen pregnant yet. She goes quieter, not louder. Her father, who was a school headmaster in Sheikhupura before he retired, taught her that a person who shouts has already lost the argument. She has not shouted since she was fifteen and she does not intend to start.</p>
        </section>

        <section>
          <h2>The House</h2>
          <p>She lives in her sasural on Faisal Road in Model Town Extension. It is a joint family setup, twelve marla, two storeys, whitewashed on the outside and the inside painted a soft yellow her mother-in-law calls cream and everyone else knows is yellow. Her room, which she shares with her husband Faizan, is on the first floor, at the back, overlooking the boundary wall of a neighbour who runs a small tuition centre. The paint in there is a colder off-white she picked out herself the week after the wedding, in a small assertion nobody objected to but everyone noticed.</p>
          <p>The bed is a heavy sheesham with drawers underneath — dowry, from her mother, one of the few pieces from her side. There is a Godrej almirah her mother-in-law bought them, a small dressing table Faizan already had, and a prayer rug rolled and standing in the corner of the almirah. The window has grill work and a green cotton curtain her sister sent from Islamabad.</p>
          <p>The low-grade family fight has been going on since the second month of the marriage. Her mother-in-law wants the couple to move downstairs into the bigger bedroom that used to be Faizan's older brother's, before he took his wife and shifted to Bahrain. Faizan does not want to, for reasons he has not fully articulated even to Hira. His mother reads this as Hira's influence, which it is not, though Hira is not going to argue for a move she does not want either. The room downstairs shares a wall with her mother-in-law's. Sound carries. Also, the almirah is built in. She would not be able to move her spine object.</p>
          <p>Her father-in-law is retired PIA ground staff, sits in the TV lounge from Maghrib onwards watching Turkish dramas dubbed into Urdu, keeps his opinions of Hira mostly to himself, which she is grateful for. Her mother-in-law is fifty-eight, active, runs the kitchen, runs the household budget, and runs a small side hustle stitching shalwar-kameez for a set of neighbourhood women. The mother-in-law's sister, Rukhsana Phupho, visits every Friday and stays till Isha and asks Hira the same three questions about children each time.</p>
          <p>Faizan has one younger brother, Waseem, twenty-three, doing his MBA at UMT, still living at home. Waseem is the one who put a Wi-Fi extender in Hira and Faizan's bedroom without asking, which Hira has never fully forgiven, because it means the router log knows every hour her phone is awake.</p>
        </section>

        <section>
          <h2>The Sister</h2>
          <p>Her sister is Aiman Malik-Rehman, thirty, married four and a half years to Salman Rehman, a mid-level manager at a telecom company. Aiman lives in G-11, Islamabad, in a rented two-bedroom on the ground floor of a house whose landlord likes to appear at the gate on the first of every month. She has a daughter, Musfira, who is two and a half and refuses to sleep before eleven, which is why the call happens when it happens.</p>
          <p>Aiman did a Masters in Development Studies and worked at an NGO for three years before Musfira arrived. She is currently not working, is not sure whether that is temporary or permanent, and is angrier about it than she lets on. Her marriage is <em>fine</em>, which is a word she uses often enough that Hira has learned to hear it. Salman is a good man, decent, a little dull, does not fight, does not drink, does not hit, remembers birthdays. Aiman loves him in the way you love a well-made cotton kurta. She has not told anyone this, including Hira, but Hira has guessed some of it.</p>
          <p>The call happens at 11:17 every night. Not eleven, because Musfira is often still fussing at eleven. Not eleven-thirty, because Salman comes upstairs at eleven-thirty for water. Eleven-seventeen is the four-minute window when Musfira is finally out, Salman is in the bathroom brushing, and Aiman can sit on the balcony with a mug of doodh patti and a phone pressed to her ear. Hira takes the call in the bathroom of her own bedroom, standing near the exhaust fan for the white noise. They speak in a Punjabi-Urdu mix nobody in either house understands quickly. If either of them ever misses a call, the other assumes something is wrong, and both of them know it.</p>
        </section>

        <section class="highlight">
          <h2>The Spine Object</h2>
          <p>It is a small hardback black notebook, A6 size, elastic-band closure, the kind sold at Liberty Books for eight hundred rupees. It sits inside a folded old dupatta of her grandmother's — heavy cotton, pale green — which is folded around it flat and then wedged between the bedframe and the mattress, on Hira's side, about a third of the way down. Faizan does not make the bed. The maid comes only twice a week and never lifts the mattress. Waseem's Wi-Fi extender does not reach through the mattress. The notebook has never been photographed and does not exist on any cloud.</p>
          <p>The first page is a page of receipts stuck in with a bit of tape, small purchases so if anyone ever opens it accidentally it looks like a housewife's expenses book. Chai Rs 60, silver polish Rs 240, dupatta pin Rs 180. Then, from page four onwards, the actual content begins.</p>
          <p>It is a private log of anomalies from the office, kept in Hira's own shorthand. Initials only, no full names. Times to the minute. A column for what the person officially said or wrote — in the digital sign-in, in the calendar, on the courier slip, in casual conversation to her — a column for what actually happened, and a small third column marked with a symbol she calls the <em>shak</em>, which is a tiny star, for entries she cannot make sense of.</p>
          <p>There are one hundred and twelve pages of entries. Most are harmless: a director who signs out at six and comes back at nine, an assistant whose courier bag is heavier than the paperwork should make it, a driver who waits four hours and never uses the toilet. Twenty-three entries have stars. Four are recent, from the last six weeks. Three of the four stars belong to the same man's initials. She has not written the fourth star's owner in initials at all. Only the time, only the place.</p>
        </section>

        <section>
          <h2>The Routine</h2>
          <p>Alarm at six-ten. Fajr, whose window in this season is tight, at six-twenty. Breakfast with the joint family at six-fifty — paratha, doodh patti, whatever fruit is going, her mother-in-law's ongoing commentary on the day's plans. Faizan leaves for the bank at seven-fifteen, drops her at Halcyon Reach on his way if his branch has an early meeting, which is roughly two mornings a week. The other three mornings she takes an Uber, and the Uber has moved from the six-hundred-rupee bracket to the eight-hundred-and-fifty-rupee bracket in the last four months because she takes a slightly longer route now.</p>
          <p>She reaches the office at seven-forty-five. Bilal is already there. She goes in through the side entrance, checks the courier log book — which she keeps in parallel to the digital one, because the digital one glitches, which nobody upstairs has been made to fully understand — refills her toffee jar from the Cadbury Roses tin under her desk, wipes down the counter, opens the sign-in tablet at eight-oh-five.</p>
          <p>Eight-thirty onward the building starts to fill up. Nine-fifteen is peak reception traffic — couriers, walk-ins, contractors, the tea vendor. Ten-thirty is her fifteen-minute breathing window when everyone is settled at their desks. Eleven till one is the biggest anomaly-catching window because the executive floor moves and reshuffles meetings then. She logs mentally, writes at night.</p>
          <p>Lunch is at one-thirty, alone at her desk with a lunchbox her mother-in-law packs, unless she has offered to relieve Ayesha at the desk so Ayesha can eat with the HR girls, which she does more often than she needs to. She has cut her lunches from her mother-in-law's home tiffin to smaller portions three days a week and told the household she is on a diet. She is not on a diet. The money she saves — by not buying a canteen chai, by walking to the nearer pharmacy for her sanitary supplies instead of the DHA one, by refusing every after-work chai invitation from the girls — is roughly nine hundred rupees a week. That money goes into an envelope in the false bottom of her handbag, and once a fortnight to an ATM.</p>
          <p>Six is closing. She does not leave at six. She stays till six-fifteen minimum, sometimes seven, tidying, cross-checking who has signed out and who has not. She now leaves the building only when at least two other women from the second floor are leaving. If they are not, she waits in the small side corridor near the R&amp;D room and pretends to be on a call. This started six weeks ago.</p>
          <p>Home by seven-fifteen on a good day, seven-forty-five on a bad one. Evening with the joint family. Dinner at nine. In the bedroom by ten. Faizan is usually on his phone till eleven, then to bathroom, then to bed. At eleven-seventeen she is in the bathroom on her call.</p>
          <p>The small sacrifice she does not talk about: she takes the same auto-rickshaw home two Wednesdays out of four, from a stand she trusts near Kalma Chowk, instead of an Uber. The auto costs three hundred and twenty, the Uber costs seven-fifty. She saves the difference. That is her mother's medicine money for the month.</p>
        </section>

        <section>
          <h2>Rishtas and the Baby Question</h2>
          <p>She is married. The pressure is different in shape now, more diffuse, less answerable. Her mother-in-law has moved from the first six months of gentle jokes — <em>"beta koi khushkhabri?"</em> with a knowing squeeze of the arm — to the last six months of pointed comments in front of visiting Phupho: <em>"Ab Aiman ki beti bhi barhi ho gayi hai, dekho na."</em> Rukhsana Phupho has already offered the name of a hakim near Data Sahab. Two weeks ago her father-in-law, who never says anything, said one thing at dinner: <em>ghar mein bachhon ki awaaz honi chahiye, beti.</em> Hira nodded. Faizan looked at his plate.</p>
          <p>The specific candidate now, in the way rishtas have specific candidates, is a child. Not a person. But her mother-in-law has quietly begun mentioning the daughter of a family friend whose son and daughter-in-law had their first within eight months, as though this is a fact that reflects on Hira personally.</p>
          <p>Hira has been taking a low-dose oral contraceptive since two months before the wedding. She has told nobody. She buys it from a pharmacy in Muslim Town, not the one nearer to her sasural, and pays cash. She has told Aiman she is not ready. She has not told Aiman that she is actively preventing.</p>
          <p>The thing she has noticed about Faizan that she has not told anyone, not even Aiman: he does not push. He has not asked for a baby, not once. In a household this loud about children, that silence is doing something. She does not know if it is kindness, or fear, or something he is not telling her. The three possibilities do not sit next to each other well in her head.</p>
        </section>

        <section>
          <h2>Money</h2>
          <p>Base salary at Halcyon Reach: ninety-two thousand rupees a month, into an HBL account she has kept since her junior-receptionist days.</p>
          <p>The split, in her head, exact. Thirty thousand goes to the household — she hands it in cash to her mother-in-law on the fifth of every month, in an envelope. Her mother-in-law does not ask for it and Hira does not stop giving it. Eight thousand five hundred goes to her mother in Sheikhupura, transferred through EasyPaisa on the seventh, labelled <em>medicine</em> in the notes field. Her father does not know the amount. Her mother has been widowed of one steady income since his retirement in a way she has not fully acknowledged.</p>
          <p>Roughly twelve thousand a month, cash, goes into the envelope in the false bottom of her handbag, and from there, in irregular deposits, into a separate savings account in a bank her husband does not use. The rest, about forty thousand, is her phone bill, her Uber, her office lunches (fictional now), her sanitary needs, her personal petrol contribution when Faizan drops her, the household groceries she pretends not to have paid for, and small gifts for Musfira.</p>
          <p>The lie to family is the savings account. It is in her maiden name, at a small bank her husband and in-laws do not use. She opened it a month before the nikah. Nobody knows the amount. The passbook is inside the notebook, folded, glued to page eighty-three so it lies flat.</p>
          <p>The three shapes of what she is saving toward. The first, and the one she says out loud to Aiman when Aiman asks, is a cushion. A wife should have her own money. Her mother did not, and she watched what it did.</p>
          <p>The second, less spoken but still allowable, is a small future. If she and Faizan ever move out of the joint family setup, if they ever need a deposit on a two-bedroom in Garden Town, if she ever needs to help Aiman when Salman's job wobbles — and it will wobble, she can see it wobbling in the telecom sector already — she wants to be able to.</p>
          <p>The third, new, dark, and something she cannot stop thinking about: a way out. Not out of the marriage exactly. Out of the country if she has to. A passport renewal she has quietly initiated, a NADRA appointment she took at ten-past-nine on a working day, a print-out of a Turkey e-visa policy for Pakistani passport holders that is folded inside the notebook on page seventy-one. She has not admitted this to herself in words. She has admitted it in the amount she now saves, which has doubled since six weeks ago.</p>
        </section>

        <section>
          <h2>The People She Watches</h2>
          <p><strong>Bilal Ahmed (R3).</strong> Ex-army, admin coordinator. She has worked next to him for five years. She has watched him walk the same routes every morning and evening. She has watched him remember the janitors' names and their pay dates, which she respects. She has watched him keep the walkie-talkie on his belt even though nobody else uses one, which she has never fully understood. Two contradictions she cannot reconcile. One: Bilal is the person in the building who covers for her when a walk-in gets aggressive, who once stepped between her and a courier who was shouting, who has never in five years spoken to her in anything but a professional register. Two: Bilal was the man she saw in the parking lot at eight-forty-seven on a Wednesday six weeks ago, in an idling silver car she did not recognise, handing a manila envelope to a man she did not recognise, and taking something small back in his own palm. His walkie-talkie was on his belt. It was off. He saw her. He nodded. She nodded. She has three stars against BA in the notebook now.</p>
          <p><strong>Kamran Sheikh (H3).</strong> HR business partner for the executive floor. She reports to him only nominally, when the reception seat is being restructured. He greets her by name, asks after her mother, remembers that her sister lives in Islamabad. She likes him. She is careful with him. Two contradictions. He is the man in HR that the second-floor girls come to when something has gone wrong on the third floor, which suggests he is trusted, or at least useful. He is also the man whose quiet questions have twice sent people from Halcyon Reach on unpaid leave that turned into resignation, both times cleanly, both times with signed NDAs Hira has seen going through the courier log. She does not know which is the true face and which is the mask, or whether both are true at once, which is the version that frightens her most.</p>
          <p><strong>Faraz Habib (E2).</strong> Co-founder, Chief Creative Officer. He was the one who, in her second year, told the COO that the junior girl on the desk had a memory better than the digital sign-in and should be promoted. He greets her by name every morning at eight-thirty-two, plus or minus one minute. He has never once been unkind to her. Two contradictions. He is warmer than Shahbaz sahib, gentler, the kind of employer who asks after a person's mother without needing to be prompted. He is also the executive who does not sign in on Fridays, has not signed in on any Friday she can remember, and whose Friday movements do not match the calendar patches she processes for his assistant. She has rationalised this many ways. She has not put a star against FH. She is aware that this restraint is itself a choice, and she is aware that the choice may not be neutral.</p>
          <p><strong>Shahbaz Sethi (E1).</strong> The founder. The CEO. She sees him seven or eight times a week, minimum. He is polite to her without being warm, which she prefers, because warm from that height would feel like a debt. Two contradictions. He is the man who once, four years ago, when a client's driver put his hand on her wrist at reception, walked out of his office, said one sentence to the client (she did not catch the sentence), and the driver was gone within ten minutes and the client apologised in writing by the next morning. He is also the man whose temper she has heard through the walls of E1 on three occasions in the last year, always at Faraz sahib, always about something to do with money, and each time she has pretended not to hear.</p>
        </section>

        <section>
          <h2>What She Is Good At</h2>
          <p>She has an eidetic memory for faces attached to timings. She can tell you when a person she last saw eight months ago walked into this building and what they were carrying. She thinks this is a normal thing everyone can do. She has never been tested and would score in a percentile that would surprise her.</p>
          <p>She is good at Urdu and English switching mid-sentence for the register of whoever has walked in, and functional in Punjabi for the couriers and vendors, which is a survival skill she learned from her father's headmaster's office in Sheikhupura where anyone could walk in and complain and had to be heard in whichever language they were most themselves in.</p>
          <p>She is good with paper. Physical, three-column, cross-referenced. She trusts paper. She distrusts the sign-in tablet, which she has watched glitch enough times to know that its version of reality is not the whole one.</p>
          <p>She is very good at not seeming surprised. She learned this at fourteen when her mother, in the middle of an argument with her father, said something in front of Hira that Hira was not supposed to know, and Hira kept her face still and her mother never realised she had heard it. That day taught her that a still face is a form of power.</p>
        </section>

        <section>
          <h2>What She Is Bad At</h2>
          <p>She cannot ask for things directly. Not raises, not favours, not help. She will hint, she will position, she will make the ask so easy the other person offers it, but she will not put the sentence in the air herself. This is not skill. This is fear. It is the fear that if she asks and is refused, she will have shifted the relationship, and she is not sure any of her relationships — including her marriage, if she is being honest at eleven-seventeen — would survive that shift.</p>
          <p>The thing she thinks is a personal defect but is not: her difficulty relaxing socially. She thinks she is bad at friendship, at chitchat, at the girls' after-work chai at the roadside dhaba. She is not. She is watching too closely to relax. What she reads as her own coldness is actually her own attention. She has not made this distinction yet.</p>
        </section>

        <section>
          <h2>The Tells</h2>
          <p>One: when she is stressed, she cleans the surface of her silver watch with her thumb, small circular motions, until the face is smudge-free. Anyone who has been at reception long enough has seen her do it. Nobody has said anything.</p>
          <p>Two: when she is lying — to a walk-in about a director's availability, to her mother-in-law about her cycle, to Aiman about how tired she is — she takes off her glasses and folds them and puts them back on. Nobody has clocked this because the glasses are not prescription and the gesture reads as thoughtful.</p>
          <p>Three, the one that betrays her without her knowledge: when she is afraid, actually afraid, not just tense, her lower right eyelid twitches, small and fast, once every four or five seconds. She does not know it does this. Bilal Ahmed has noticed.</p>
        </section>

        <section>
          <h2>Faith</h2>
          <p>She prays four of the five, missing Zuhr on office days because there is nowhere at reception she can go without abandoning the desk. She keeps a folded prayer mat in the small drawer under the counter. She fasts Ramadan without complaint. She reads Surah Yaseen on Friday mornings in the fifteen minutes before the office fills. Her Arabic is careful, her Urdu translation loose, her understanding somewhere in between.</p>
          <p>Where she slips: she has developed a habit of asking Allah for very small, very specific things. Please let the courier van be on time today. Please let Faraz sahib's assistant not need me to reschedule the four-thirty. Please let my mother-in-law be at the tailor's when I get home. She is aware this is not the kind of dua her Nani would have approved of, and she has not stopped.</p>
          <p>The private ritual she started three weeks ago, and has told no one about: after Isha, in her bathroom, standing on the cold tiles, she recites Ayat al-Kursi three times. Then, in Urdu, quietly, once, she says: <em>Ya Allah, jo main dekh rahi hoon, agar sach hai, mujhe himmat de. Agar jhoot hai, mujhe maaf kar.</em> She thinks the word <em>himmat</em> is what she means. She is not sure. She keeps saying it.</p>
        </section>

        <section class="highlight">
          <h2>The Secret She Has Not Told the Sister</h2>
          <p>Six weeks ago, on a Wednesday, she stayed late to finish a batch of courier receipts because the audit team was going to be in on Friday. It was eight-thirty when she left her desk. The reception area was empty. The main gate was locked, so she went out through the side, past the small generator room, to the staff parking lot, because she had ordered an Uber and the driver had messaged her to say he was two minutes out and could she come to the gate.</p>
          <p>She saw a silver Toyota Corolla she did not recognise, idling near the exit gate with the parking lights on. Bilal Ahmed was standing at the driver's window. Bilal handed a manila envelope through the window. The driver, whose face she could not see clearly — male, older, moustache, dark polo — passed something small back into Bilal's palm. Bilal put it in his shirt pocket. He said one short sentence she could not hear. The Corolla drove out. Bilal turned. Saw her. His walkie-talkie was on his belt. It was silent. She has replayed this moment enough times that she is now sure. It was silent.</p>
          <p>He nodded. She nodded. She said, in the voice she uses for walk-ins, <em>"Uber aa raha hai, Bilal bhai, main gate pe khari ho jaati hoon."</em> He said, <em>"Theek hai, beta."</em> She walked to the gate. Her hands did not shake till she was in the Uber. She has not spoken about this to anyone. Not Faizan. Not Aiman. Not the notebook, in words. Only in initials and time.</p>
          <p>The small behavioural changes since. She has mapped three alternate routes home from the office and rotates them. She used to take the same one every night. She now leaves the office building only when other women are leaving, and if they are not, she waits. She has changed the passcode on her phone from her wedding date to a six-digit number that has no meaning to anyone including her. She has started carrying a small pepper spray Aiman sent from Islamabad two years ago in a New Year's care package — Aiman thought it was funny. She has stopped keeping her house keys in the outer pocket of her handbag because they clip to a small tag with her sasural's address on the back, and she has taken that tag off. She has not told her mother-in-law that the tag is missing. Her mother-in-law has not noticed.</p>
          <p>She has also, in the last two weeks, walked past Bilal Ahmed's desk when he is not there, twice, and looked at his diary, because she knows he keeps one. Both times the diary was on the desk. Both times it was closed. She has not opened it. She has thought about it enough that she now knows she would, if she thought she had a clean forty seconds.</p>
        </section>

        <section>
          <h2>What She Wants</h2>
          <p>On the surface, she wants a promotion into administrative operations, a small increment, a title on her desk that reads <em>Executive Assistant to Reception</em> rather than <em>Senior Receptionist</em>. She has drafted the ask in her head twelve times.</p>
          <p>She wants Aiman to come back to work, to be less careful with Salman, to be less careful in general.</p>
          <p>She wants her mother-in-law to stop asking, and her father-in-law to keep saying nothing, and Waseem to move his Wi-Fi extender out of her bedroom.</p>
          <p>Underneath, in the layer she has not admitted even in the notebook, she wants to be the one who catches something. Not for the promotion, not for the story, not for revenge. For the moment. She wants to be able to place, in front of the right person, at the right time, in three neat columns, the thing she has been carrying for five years and stop carrying it. She wants to know that the still face was worth something.</p>
        </section>

        <section>
          <h2>What She Fears</h2>
          <p>She fears her mother-in-law finding the notebook.</p>
          <p>She fears Faizan finding the second bank account.</p>
          <p>She fears her mother's diabetes getting worse in Sheikhupura and having to move her here, into a house where there is no room.</p>
          <p>She fears Bilal Ahmed one day taking the walkie-talkie off his belt and setting it on her counter and saying, without preamble, <em>"Beta, aap ne kya dekha tha uss raat?"</em></p>
          <p>She fears Aiman leaving Salman, because if Aiman does, Hira is not sure she will not.</p>
          <p>She fears that the man she saw in the silver Corolla was not a stranger. That she has seen him before, in the reception book, in the executive calendar, and that she has not put the pieces together yet. That her memory, the thing she trusts most, is not as complete as she thinks.</p>
          <p>She fears, more than anything else, that she is wrong. That the twenty-three stars are twenty-three coincidences, that Bilal's envelope was a favour to a cousin, that Faraz sahib's Friday absences are prayer, that Kamran sahib's questions are just questions, that Shahbaz sahib's temper is just a temper, and that she has built, over five years, a private map of a threat that does not exist. That she is the kind of woman whose stillness at fourteen has curdled into paranoia at twenty-six. That the still face was for nothing.</p>
        </section>

        <section class="closing">
          <h2>Where She Is at the Start</h2>
          <p>It is Tuesday, eight-forty-three in the morning. She is at the reception counter on Floor 1 of Halcyon Reach Media Group. The sign-in tablet is open. Her toffee jar is refilled. Her silver watch has been polished twice already this morning. Behind her, through the glass partition, she can hear the first assistants coming off the lift for Floor 3, laughing about something Kamran sahib said in yesterday's town hall. Bilal Ahmed walked past her desk four minutes ago without stopping, on his second sweep of the building, and did not say good morning, which he usually does.</p>
          <p>The courier log is open in front of her. There is one entry from last night that does not match the digital record. A DHL pouch signed for at seven-oh-two, to E2, whose office was empty by six-forty according to her own memory, and whose Uber pickup on the driver-tracker app — she has never mentioned that she watches the driver-tracker app — shows him at Liberty Market at six-fifty-five.</p>
          <p>She reaches for the small hardback black notebook that is not in her bag. It is on her side of the mattress at home in Model Town Extension. She catches herself reaching, closes her hand around the silver watch instead, and cleans the face with her thumb, once, twice, small circular motions, until the smudge is gone.</p>
